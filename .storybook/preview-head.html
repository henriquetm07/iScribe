<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Storybook's own docs buttons and form fields ("Show code", "Copy code", Controls inputs) don't inherit the page font; use Figtree. iScribe components set their own font. */
  .sbdocs button:not([class*='is-']),
  .sbdocs input:not([class*='is-']),
  .sbdocs select,
  .sbdocs textarea {
    font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
</style>
<style>
  /* Dark mode covers the whole board: page background and text, not only the components */
  html[data-theme='dark'] {
    color-scheme: dark;
  }
  html[data-theme='dark'] body {
    background: var(--is-background-elevated-background);
    color: var(--is-foreground-high-contrast-primary-foreground);
  }
</style>
<style>
  /* While switching Light / Dark, colors fade instead of jumping (the class is on for ~0.4s, see preview.ts) */
  html.is-mode-switching,
  html.is-mode-switching *,
  html.is-mode-switching *::before,
  html.is-mode-switching *::after {
    transition:
      background-color 300ms ease,
      color 300ms ease,
      border-color 300ms ease,
      fill 300ms ease,
      stroke 300ms ease,
      box-shadow 300ms ease !important;
  }
  @media (prefers-reduced-motion: reduce) {
    html.is-mode-switching *,
    html.is-mode-switching *::before,
    html.is-mode-switching *::after {
      transition: none !important;
    }
  }
</style>
<style>
  /*
   * Page titles (the big H1 at the top of every docs page) in Season Mix Regular, as in the brand.
   * Season Mix is a licensed font that isn't bundled with the site yet: it shows wherever it is installed
   * on the viewer's computer, and falls back to Figtree elsewhere. To make it show for everyone, add the
   * web font files (e.g. .storybook/public/fonts/SeasonMix-Regular.woff2) and a url(...) line below.
   */
  @font-face {
    font-family: 'Season Mix';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: local('Season Mix'), local('Season Mix Regular'), local('SeasonMix-Regular');
  }
  .sbdocs-content h1 {
    font-family: 'Season Mix', 'Figtree', system-ui, sans-serif !important;
    font-weight: 400 !important;
  }
</style>
