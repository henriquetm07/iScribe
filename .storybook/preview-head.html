<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Storybook's own docs buttons and form fields ("Show code", "Copy code", Controls inputs) don't inherit the page font; use Figtree. iScribe components set their own font. */
  .sbdocs button:not([class*='is-']),
  .sbdocs input:not([class*='is-']),
  .sbdocs select,
  .sbdocs textarea {
    font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
</style>
