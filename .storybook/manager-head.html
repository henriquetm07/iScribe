<!--
  Sidebar and top bar styled like the iScribe brand guidelines site (colors are set in manager.ts).
  Only the look changes: section titles in title case, quiet rows, a navy selected row and thin dividers.
-->
<style>
  /* Logo area: taller, with a divider under it */
  .sidebar-header {
    min-height: 56px;
    margin: -8px -10px 8px !important;
    padding: 8px 10px 0;
    border-bottom: 1px solid #232527;
  }
  .sidebar-header > div:has(a[href="./"]) {
    padding-left: 22px;
  }

  /* Section titles (Foundations, Components): title case, semibold, with a divider above */
  #storybook-explorer-tree .sidebar-subheading {
    margin-top: 12px;
    padding-top: 12px;
    height: auto;
    border-top: 1px solid #232527;
  }
  #storybook-explorer-tree .sidebar-subheading button {
    color: #9ba3ac !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    letter-spacing: 0 !important;
    text-transform: none !important;
  }
  #storybook-explorer-tree .sidebar-subheading button:hover {
    color: #f0f2f4 !important;
  }

  /* Rows: regular weight grey text, 6px corners */
  #storybook-explorer-tree .sidebar-item {
    min-height: 32px;
    border-radius: 6px !important;
    color: #9ba3ac !important;
  }
  #storybook-explorer-tree .sidebar-item a,
  #storybook-explorer-tree .sidebar-item button {
    color: #9ba3ac !important;
    font-size: 14px !important;
    font-weight: 400 !important;
  }
  #storybook-explorer-tree .sidebar-item:hover {
    background: rgba(240, 242, 244, 0.04) !important;
  }
  #storybook-explorer-tree .sidebar-item:hover a,
  #storybook-explorer-tree .sidebar-item:hover button {
    color: #f0f2f4 !important;
  }
  /* Muted icons instead of Storybook's colored ones */
  #storybook-explorer-tree .sidebar-item svg {
    color: #6d747c !important;
  }

  /* Selected page: navy background, near-white text */
  #storybook-explorer-tree .sidebar-item[data-selected='true'] {
    background: #151b2f !important;
  }
  #storybook-explorer-tree .sidebar-item[data-selected='true'] a,
  #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
    color: #f0f2f4 !important;
    font-weight: 500 !important;
  }

  /* Top bar: same near-black as the sidebar, with a divider under it */
  .sb-bar {
    border-bottom: 1px solid #232527;
  }
</style>
