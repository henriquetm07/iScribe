<!--
  Sidebar and top bar styled like the iScribe brand guidelines site (colors are set in manager.ts).
  Only the look changes: section titles in title case, quiet rows, a navy selected row and thin dividers.
-->
<style>
  /* Logo area: taller, with a divider under it */
  .sidebar-header {
    min-height: 56px;
    margin: -8px -10px 8px !important;
    padding: 0 8px 10px !important;
    border-bottom: 1px solid #232527;
  }
  .sidebar-header > div:has(a[href="./"]) {
    padding-left: 22px;
  }

  /* Section titles (Foundations, Components): title case, semibold, with a divider above */
  #storybook-explorer-tree .sidebar-subheading {
    margin-top: 12px;
    padding-top: 12px;
    height: auto;
    border-top: 1px solid #232527;
  }
  #storybook-explorer-tree .sidebar-subheading button {
    color: #9ba3ac !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    letter-spacing: 0 !important;
    text-transform: none !important;
  }
  #storybook-explorer-tree .sidebar-subheading button:hover {
    color: #f0f2f4 !important;
  }

  /* Rows: regular weight grey text, 6px corners */
  #storybook-explorer-tree .sidebar-item {
    min-height: 32px;
    border-radius: 6px !important;
    color: #9ba3ac !important;
  }
  #storybook-explorer-tree .sidebar-item a,
  #storybook-explorer-tree .sidebar-item button {
    color: #9ba3ac !important;
    font-size: 14px !important;
    font-weight: 400 !important;
  }
  #storybook-explorer-tree .sidebar-item:hover {
    background: rgba(240, 242, 244, 0.04) !important;
  }
  #storybook-explorer-tree .sidebar-item:hover a,
  #storybook-explorer-tree .sidebar-item:hover button {
    color: #f0f2f4 !important;
  }
  /* No page or folder icons next to the items; the expand arrows stay, muted */
  #storybook-explorer-tree .sidebar-item svg[type] {
    display: none !important;
  }
  #storybook-explorer-tree .sidebar-item svg {
    color: #6d747c !important;
  }

  /* Selected page: navy background, near-white text */
  #storybook-explorer-tree .sidebar-item[data-selected='true'] {
    background: #151b2f !important;
  }
  #storybook-explorer-tree .sidebar-item[data-selected='true'] a,
  #storybook-explorer-tree .sidebar-item[data-selected='true'] svg {
    color: #f0f2f4 !important;
    font-weight: 500 !important;
  }

  /* Top bar: same near-black as the sidebar, with a divider under it (no extra shadow line), 50px tall */
  .sb-bar {
    border-bottom: 1px solid #232527;
    box-shadow: none !important;
  }
  .sb-bar > [role='toolbar'] {
    height: 50px !important;
  }
</style>

<!-- Light / Dark toggle in the top bar (manager.ts), styled after the Tabs component, on the dark top bar -->
<style>
  .is-mode-toggle {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin: 0 4px;
    padding: 3px;
    border-radius: 1000px;
    background: rgba(255, 255, 255, 0.04);
    font-family: 'Figtree', system-ui, sans-serif;
  }
  .is-mode-toggle__option {
    position: relative;
    z-index: 1;
    width: 64px;
    height: 24px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 1000px;
    background: none;
    color: #9ba3ac;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: color 200ms ease;
  }
  .is-mode-toggle__option:hover,
  .is-mode-toggle__option--on {
    color: #f0f2f4;
  }
  .is-mode-toggle__option:focus-visible {
    outline: 2px solid #3966ff;
    outline-offset: 1px;
  }
  /* The selection: Tabs' periwinkle glass (dark mode values), sliding between the two options */
  .is-mode-toggle__glass {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 64px;
    height: 24px;
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 1000px;
    background: rgba(57, 102, 255, 0.2);
    box-shadow:
      inset 1.5px 1.5px 1px -0.5px rgba(255, 255, 255, 0.42),
      inset -1.5px -1.5px 1px -0.5px rgba(255, 255, 255, 0.26),
      inset 0 0 8px rgba(255, 255, 255, 0.06);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .is-mode-toggle[data-mode='dark'] .is-mode-toggle__glass {
    transform: translateX(66px);
  }
  @media (prefers-reduced-motion: reduce) {
    .is-mode-toggle__glass {
      transition: none;
    }
  }
</style>

<!-- Text selection highlight in the sidebar and top bar: T Periwinkle 20 -->
<style>
  ::selection {
    background: rgba(57, 102, 255, 0.2);
  }
</style>
